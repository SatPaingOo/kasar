name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Canon 09 section 6: lint, typecheck and tests, all three, each one
      # failing the build. A warning-only CI is decoration.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # The shelf and every game compile, and the site can be assembled.
      - run: npm run build
      - run: npm run stage
