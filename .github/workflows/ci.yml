name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The shelf and every game, in one pass. A game that does not compile
      # fails here and never reaches main.
      - run: npm run typecheck

      - run: npm run build

      # Proves the site can actually be assembled, not just compiled.
      - run: npm run stage
