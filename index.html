<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kasar</title>
    <meta name="description" content="A shelf of small browser games." />
    <style>
      /*
        The shelf is deliberately quiet. Every colour on this page is a grey
        except the ones a game brings with it, because the shelf's job is to
        frame games rather than to look like one. The first version borrowed
        Tazaung's night sky, lantern and drifting embers: it read well with a
        single game on the shelf and would have fought the second.
      */
      :root {
        color-scheme: dark;
        --ink: #f2f4f8;
        --ink-dim: #99a1b2;
        --line: #23262e;
        --line-soft: #1b1f27;
        --surface: #0b0d11;
        --surface-raised: #11141a;
        --focus: #cdd4e2;
        --font: 'Myanmar Text', 'Noto Sans Myanmar', 'Padauk', system-ui, sans-serif;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: var(--font);
        background-color: var(--surface);
        /* A faint technical grid: structure, not atmosphere. */
        background-image:
          linear-gradient(var(--line-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
        background-size: 64px 64px;
        background-position: -1px -1px;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .page {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 clamp(1rem, 4vw, 2.5rem);
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      /* ---- masthead ------------------------------------------------- */

      header {
        padding: clamp(2.5rem, 9vh, 5rem) 0 clamp(1.5rem, 4vh, 2.25rem);
        border-bottom: 1px solid var(--line);
      }

      .rail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      /* The right of the rail carries the shelf's own readout, so the masthead
         spans the page instead of huddling in one corner. */
      .readout {
        display: flex;
        align-items: center;
        gap: clamp(0.75rem, 2vw, 1.25rem);
      }

      .count {
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }

      html[lang='my'] .count {
        font-family: var(--font);
        letter-spacing: 0.01em;
        text-transform: none;
        font-size: 0.84rem;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 0.95rem;
        min-width: 0;
      }

      .glyph {
        flex: none;
        width: clamp(1.9rem, 5vw, 2.4rem);
        height: auto;
        color: var(--ink);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 2.9rem);
        font-weight: 600;
        letter-spacing: 0.16em;
        line-height: 1;
        text-transform: uppercase;
      }

      .tagline {
        margin: 1.25rem 0 0;
        font-size: clamp(0.84rem, 2.4vw, 0.92rem);
        letter-spacing: 0.01em;
        color: var(--ink-dim);
      }

      /* The mono, spaced, upper-case treatment is for Latin metadata only. */
      html[lang='en'] .tagline {
        font-family: var(--mono);
        font-size: clamp(0.72rem, 2.2vw, 0.78rem);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .by {
        margin: 0.45rem 0 0;
        font-size: 0.82rem;
        color: var(--ink-dim);
      }

      .by a {
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 1px;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .by a:hover,
      .by a:focus-visible {
        color: var(--ink);
        border-color: currentColor;
      }

      button {
        flex: none;
        font-family: var(--font);
        font-size: 0.82rem;
        letter-spacing: 0.02em;
        color: var(--ink-dim);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 0.5rem 0.9rem;
        min-height: 2.25rem;
        cursor: pointer;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }

      button:hover,
      button:focus-visible {
        color: var(--ink);
        border-color: var(--ink-dim);
      }

      /* ---- the shelf ------------------------------------------------ */

      main {
        flex: 1;
        padding: clamp(1.75rem, 5vh, 2.75rem) 0 clamp(3rem, 10vh, 5rem);
      }

      #shelf {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: clamp(1rem, 2.5vw, 1.6rem);
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 18.5rem), 1fr));
      }

      .card {
        --accent: #8fa6c8;
        position: relative;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
        transition:
          border-color 0.18s ease,
          transform 0.18s ease;
      }

      /* The game's own colour enters here and nowhere else on the page. */
      .card::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 2px;
        z-index: 1;
        background: var(--accent);
        opacity: 0.5;
        transition: opacity 0.18s ease;
      }

      .card:hover,
      .card:focus-visible {
        border-color: var(--accent);
        transform: translateY(-2px);
        outline: none;
      }

      .card:hover::before,
      .card:focus-visible::before {
        opacity: 1;
      }

      .poster {
        aspect-ratio: 16 / 10;
        max-block-size: 13rem;
        display: grid;
        place-items: center;
        padding: 1rem;
        text-align: center;
        font-size: clamp(1.15rem, 3.2vw, 1.5rem);
        font-weight: 600;
        letter-spacing: 0.04em;
        background-color: var(--accent);
        background-size: cover;
        background-position: center;
        border-bottom: 1px solid var(--line);
      }

      .body {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 0.95rem 1.05rem 1.1rem;
      }

      .name {
        margin: 0;
        font-size: 1.02rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .blurb {
        margin: 0;
        color: var(--ink-dim);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0.5rem 0 0;
        padding-top: 0.65rem;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        color: var(--ink-dim);
      }

      .tick {
        width: 0.4rem;
        height: 0.4rem;
        flex: none;
        background: var(--accent);
      }

      /* A rack with room in it. One game on a four-column grid reads as a page
         that failed to load; the same page with the remaining slots drawn
         reads as a shelf waiting to be filled. They disappear as games
         arrive, and never appear where the grid is a single column. */
      .slot {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 4px;
        min-height: 11rem;
        background-image: repeating-linear-gradient(-45deg, var(--line-soft) 0 1px, transparent 1px 11px);
        opacity: 0.55;
      }

      @media (min-width: 48rem) {
        .slot {
          display: block;
        }
      }

      .empty {
        padding: 3rem 0;
        font-family: var(--mono);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }

        .card:hover,
        .card:focus-visible {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="rail">
          <div class="mark">
            <!-- A cartridge slot with a play mark: a shelf of games, and not
                 any one of them. -->
            <svg class="glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <rect x="4.5" y="9.5" width="39" height="29" rx="2.5" stroke="currentColor" stroke-width="3" />
              <path d="M4.5 17.5h39" stroke="currentColor" stroke-width="3" />
              <path d="M20 23.5v11l9.5-5.5z" fill="currentColor" />
            </svg>
            <h1 id="title">Kasar</h1>
          </div>
          <div class="readout">
            <span class="count" id="count"></span>
            <button id="lang" type="button">မြန်မာ</button>
          </div>
        </div>
        <p class="tagline" id="tagline">Small games, one at a time.</p>
        <p class="by"><a href="https://satpaingoo.github.io/portfolio/" id="by">by Sat Paing Oo</a></p>
      </header>

      <main>
        <ul id="shelf">
          <li class="empty" id="loading">…</li>
        </ul>
      </main>
    </div>

    <script type="module" src="./dist/shell/main.js"></script>
  </body>
</html>
